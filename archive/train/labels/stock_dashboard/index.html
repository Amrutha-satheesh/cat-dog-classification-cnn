<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Intelligence Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .stock-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-height: 500px;}
       
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">🚀 Stock Intelligence</h1>
        
        <div class="row">
            <div class="col-md-4">
                <div class="list-group">
                    <button onclick="loadStock('AAPL')" class="list-group-item list-group-item-action">Apple (AAPL)</button>
                    <button onclick="loadStock('GOOGL')" class="list-group-item list-group-item-action">Google (GOOGL)</button>
                    <button onclick="loadStock('TCS.NS')" class="list-group-item list-group-item-action">TCS (India)</button>
                    <button onclick="loadStock('RELIANCE.NS')" class="list-group-item list-group-item-action">Reliance (India)</button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="stock-card">
                    <div id="stock-summary">
                        <h3>Select a company to see insights</h3>
                        <p>Click a stock on the left to fetch real-time data.</p>
                    </div>
                    
                    <div style="height: 300px; margin-top: 20px;">
                        <canvas id="priceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myChart = null; // Global variable to store the chart

        async function loadStock(symbol) {
            const summaryDiv = document.getElementById('stock-summary');
            summaryDiv.innerHTML = "<h3>Loading...</h3>";

            try {
                // 1. Get Summary Data
                const response = await fetch(`http://127.0.0.1:8000/summary/${symbol}`);
                const data = await response.json();

                if (data.error) {
                    summaryDiv.innerHTML = `<h3 class="text-danger">${data.error}</h3>`;
                    return;
                }

                // Update text summary
                summaryDiv.innerHTML = `
                    <h2 class="text-primary">${data.symbol} Summary</h2>
                    <hr>
                    <div class="row text-center">
                        <div class="col-6 mb-3">
                            <small class="text-muted">52W High</small>
                            <div class="fs-4 text-success">$${data['52_week_high'].toFixed(2)}</div>
                        </div>
                        <div class="col-6 mb-3">
                            <small class="text-muted">52W Low</small>
                            <div class="fs-4 text-danger">$${data['52_week_low'].toFixed(2)}</div>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">Risk Factor</small>
                            <div class="fs-4 text-warning">${data.volatility}%</div>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">Avg Close</small>
                            <div class="fs-4">$${data['avg_close'].toFixed(2)}</div>
                        </div>
                    </div>
                `;

                // 2. Get Chart Data
                const chartResponse = await fetch(`http://127.0.0.1:8000/data/${symbol}`);
                const chartData = await chartResponse.json();

                // 3. Render Chart
                const ctx = document.getElementById('priceChart').getContext('2d');
                if (myChart) { myChart.destroy(); } // Remove old chart

                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: chartData.dates,
                        datasets: [{
                            label: `${symbol} Price Trend`,
                            data: chartData.prices,
                            borderColor: '#0d6efd',
                            tension: 0.1,
                            fill: true,
                            backgroundColor: 'rgba(13, 110, 253, 0.05)'
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });

            } catch (error) {
                console.error("Error:", error);
                summaryDiv.innerHTML = "<h3>Connection Error.</h3>";
            }
        }
        
    </script>
</body>
</html>
